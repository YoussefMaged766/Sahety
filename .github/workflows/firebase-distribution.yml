name: Firebase App Distribution (Debug)

on:
  push:
    branches:
      - staging

env:
  # Gradle optimization environment variables
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  build-and-distribute:
    name: Build & Distribute APK
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout
        uses: actions/checkout@v4

      # Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # Make Gradle wrapper executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode google-services.json from secret
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      # Build Debug APK (optimized for speed)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel -x lint -x test --max-workers=4
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseG1GC"

      # Distribute to Firebase using gcloud directly
      - name: Distribute to Firebase App Distribution
        run: |
          # Decode service account key
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" | base64 -d > service-account-key.json
          
          # Verify the JSON file is valid
          if ! python3 -m json.tool service-account-key.json > /dev/null 2>&1; then
            echo "ERROR: Service account JSON is invalid!"
            exit 1
          fi
          
          echo "Service account JSON is valid!"
          
          # Authenticate with gcloud using the service account
          gcloud auth activate-service-account --key-file=service-account-key.json
          
          # Set project ID
          gcloud config set project "${{ secrets.PROJECT_ID }}"
          
          # Use gcloud to upload to Firebase App Distribution
          gcloud firebase test android models list > /dev/null 2>&1 || gcloud components install beta --quiet
          
          # Upload using gcloud firebase (beta)
          gcloud beta firebase appdistribution apps releases create \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --group "Sahety" \
            --release-notes "🚀 Build ${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account-key.json