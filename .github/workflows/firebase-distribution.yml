name: Firebase App Distribution (Debug)

on:
  push:
    branches:
      - staging

env:
  # Gradle optimization environment variables
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  build-and-distribute:
    name: Build & Distribute APK
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout
        uses: actions/checkout@v4

      # Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # Make Gradle wrapper executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode google-services.json from secret
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      # Build Debug APK (optimized for speed)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel -x lint -x test --max-workers=4
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseG1GC"

      # Decode Service Account
      - name: Decode Service Account
        run: echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" | base64 -d > service-account.json

      # Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      # Upload to Firebase App Distribution
      - name: Upload artifact to Firebase App Distribution
        uses: google-github-actions/upload-cloud-storage@v2
        continue-on-error: true

      # Alternative: Use Firebase CLI with proper authentication
      - name: Distribute to Firebase App Distribution
        run: |
          # Install Firebase CLI
          npm install -g firebase-tools
          
          # Set the service account credentials
          export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/service-account.json"
          
          # Distribute using Firebase CLI (it will automatically use the service account)
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups "Sahety" \
            --release-notes "🚀 Build ${{ github.run_number }}" \
            --debug
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json