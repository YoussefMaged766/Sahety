name: Firebase App Distribution (Debug)

on:
  push:
    branches:
      - staging

env:
  # Gradle optimization environment variables
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  build-and-distribute:
    name: Build & Distribute APK
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout
        uses: actions/checkout@v4

      # Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # Make Gradle wrapper executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode google-services.json from secret
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      # Build Debug APK (optimized for speed)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel -x lint -x test --max-workers=4
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseG1GC"

      # Setup and Distribute to Firebase
      - name: Distribute to Firebase App Distribution
        run: |
          npm install -g firebase-tools

          echo "Checking service account secret..."
          SECRET_LENGTH=$(echo -n "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" | wc -c)
          echo "Secret length: $SECRET_LENGTH characters"

          if [ $SECRET_LENGTH -lt 100 ]; then
            echo "ERROR: Service account secret seems too short!"
            exit 1
          fi

          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" | base64 -d > "${HOME}/service-account-key.json"

          # Export environment variable for Firebase CLI
          export GOOGLE_APPLICATION_CREDENTIALS="${HOME}/service-account-key.json"

          echo "Service account JSON is valid!"
          python3 -m json.tool "${HOME}/service-account-key.json" > /dev/null

          # Set Firebase project explicitly
          firebase use "${{ secrets.PROJECT_ID }}" --add

          # Now distribute the APK
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups "Sahety" \
            --release-notes "🚀 Build ${{ github.run_number }}"
